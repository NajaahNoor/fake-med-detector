[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "fake-med-detector"
version = "0.1.0"
description = "Agentic fake medicine detector workflow"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "streamlit>=1.35.0",
  "fastapi>=0.111.0",
  "uvicorn>=0.29.0",
  "langchain>=0.2.0",
  "langchain-openai>=0.1.0",
  "langchain-text-splitters>=0.2.0",
  "langgraph>=0.1.0",
  "sqlalchemy>=2.0.0",
  "paddlepaddle==3.0.0",
  "paddleocr>=2.7.3",
  "scrapy>=2.11.0",
  "playwright>=1.44.0",
  "pandas>=2.2.0",
  "openpyxl>=3.1.0",
  "python-docx>=1.1.0",
  "fpdf2>=2.7.9",
  "Pillow>=10.3.0",
  "python-dotenv>=1.0.0",
  "requests>=2.31.0",
  "pydantic>=2.7.0",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["app*"]

[tool.setuptools.package-data]
app = ["**/*.py"]
